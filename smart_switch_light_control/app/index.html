<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Switch Light Control</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f5; --card: #fff; --sunken: #f0f0f0; --text: #1c1c1c; --muted: #6b6b6b; --line: #d9d9d9; --accent: #03a9f4; --danger: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --card: #1e1e1e; --sunken: #2a2a2a; --text: #e6e6e6; --muted: #9b9b9b; --line: #383838; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 16px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  input.name { display: block; width: 100%; padding: 2px 6px; margin-left: -6px; font: 600 16px/1.4 system-ui, sans-serif; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 6px; }
  input.name:hover, input.name:focus { border-color: var(--line); background: var(--card); }
  .muted { color: var(--muted); font-size: 13px; }
  select, input[type=search] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
  button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.remove { color: var(--danger); padding: 4px 10px; }
  .button-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 0 0; margin-top: 12px; border-top: 1px solid var(--line); font-weight: 500; cursor: pointer; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .track { position: absolute; inset: 0; border-radius: 11px; background: var(--line); transition: background .15s; pointer-events: none; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .section { padding-top: 8px; }
  .opt { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--sunken); border-radius: 14px; padding: 3px 4px 3px 10px; font-size: 13px; }
  .chip .kind { color: var(--muted); }
  .chip button { border: 0; background: none; padding: 0 6px; font-size: 16px; line-height: 1; color: var(--muted); }
  .picker { position: relative; }
  .results { position: absolute; z-index: 5; left: 0; right: 0; margin-top: 2px; max-height: 240px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .results button { display: flex; justify-content: space-between; gap: 8px; width: 100%; border: 0; border-radius: 0; background: none; text-align: left; }
  .results button:hover, .results button:focus-visible { background: var(--sunken); }
  .results .none { padding: 8px 12px; color: var(--muted); }
  footer { display: flex; gap: 12px; align-items: center; margin-top: 4px; }
  #status { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Smart Switch Light Control</h1>
  <div id="content"></div>
  <footer><button id="save" class="primary" hidden>Save</button><span id="status" role="status"></span></footer>
</main>
<script>
const KINDS = [["entity_id", "Light", "lights"], ["area_id", "Area", "areas"], ["label_id", "Label", "labels"]];
const GESTURES = [["tap_toggle", "Tap to toggle"], ["hold_ramp", "Hold to change brightness"], ["double_tap_color", "Double tap to change temperature"]];
const MAX_RESULTS = 40;
const el = (tag, props = {}, ...children) => { const node = Object.assign(document.createElement(tag), props); node.append(...children); return node; };
const setStatus = text => document.getElementById("status").textContent = text;
let registry, switches, deviceById;

function nameOf(kind, id) {
  const source = KINDS.find(k => k[0] === kind)[2];
  return registry[source].find(item => item.id === id)?.name ?? `${id} (not found)`;
}

function targetPicker(target) {
  const chips = el("div", { className: "chips" });
  const search = el("input", { type: "search", placeholder: "Search lights, areas and labels", ariaLabel: "Search lights, areas and labels" });
  const results = el("div", { className: "results", hidden: true });

  const drawChips = () => chips.replaceChildren(...KINDS.flatMap(([kind, title]) => (target[kind] || []).map(id =>
    el("span", { className: "chip" }, el("span", { className: "kind", textContent: title }), el("span", { textContent: nameOf(kind, id) }),
      el("button", { textContent: "×", ariaLabel: `Remove ${nameOf(kind, id)}`, onclick: () => {
        target[kind].splice(target[kind].indexOf(id), 1);
        drawChips();
      } })))));

  const drawResults = () => {
    const query = search.value.trim().toLowerCase();
    const matches = KINDS.flatMap(([kind, title, source]) => registry[source]
      .filter(item => !(target[kind] || []).includes(item.id) && `${item.name} ${item.id}`.toLowerCase().includes(query))
      .map(item => ({ ...item, kind, title })));
    results.replaceChildren(...matches.slice(0, MAX_RESULTS).map(item =>
      el("button", { onmousedown: event => event.preventDefault(), onclick: () => {
        (target[item.kind] ||= []).push(item.id);
        search.value = "";
        results.hidden = true;
        drawChips();
      } }, el("span", { textContent: item.name }), el("span", { className: "muted", textContent: item.title }))));
    if (matches.length === 0) results.append(el("div", { className: "none", textContent: "Nothing found" }));
    results.hidden = false;
  };

  search.onfocus = drawResults;
  search.oninput = drawResults;
  search.onblur = () => results.hidden = true;
  drawChips();
  return el("div", {}, chips, el("div", { className: "picker" }, search, results));
}

function buttonBlock(sw, number) {
  const enabledKey = `button${number}_enabled`;
  const block = el("div");
  const toggle = el("input", { type: "checkbox", checked: sw[enabledKey] === true, ariaLabel: `Use button ${number}`, onchange: () => {
    sw[enabledKey] = toggle.checked;
    drawSection();
  } });
  const section = el("div", { className: "section" });
  const drawSection = () => {
    section.hidden = !sw[enabledKey];
    if (!sw[enabledKey]) return section.replaceChildren();
    const gestures = GESTURES.map(([key, title]) => {
      const name = `button${number}_${key}`;
      const box = el("input", { type: "checkbox", checked: sw[name] !== false, onchange: () => sw[name] = box.checked });
      return el("label", { className: "opt" }, box, el("span", { textContent: title }));
    });
    section.replaceChildren(...gestures, targetPicker(sw[`button${number}_targets`] ||= {}));
  };
  block.append(el("label", { className: "button-row" }, el("span", { textContent: `Button ${number}` }),
    el("span", { className: "switch" }, toggle, el("span", { className: "track" }))), section);
  drawSection();
  return block;
}

function switchCard(sw, index) {
  const device = deviceById.get(sw.device_id);
  const defaultName = device?.name ?? sw.device_id;
  const subtitle = el("div", { className: "muted" });
  const drawSubtitle = () => subtitle.textContent = device
    ? [sw.name ? device.name : "", device.model].filter(Boolean).join(" · ")
    : "Device not found in Home Assistant";
  const nameInput = el("input", { type: "text", className: "name", value: sw.name ?? defaultName, placeholder: defaultName, ariaLabel: "Name", maxLength: 80, oninput: () => {
    const name = nameInput.value.trim();
    if (name && name !== defaultName) sw.name = name;
    else delete sw.name;
    drawSubtitle();
  } });
  drawSubtitle();
  const card = el("section", { className: "card" }, el("div", { className: "row" },
    el("div", { className: "grow" }, nameInput, subtitle),
    el("button", { className: "remove", textContent: "Remove", onclick: () => { switches.splice(index, 1); render(); } })));
  for (let number = 1; number <= (device?.buttons ?? 0); number++) card.append(buttonBlock(sw, number));
  return card;
}

function addRow() {
  const added = new Set(switches.map(sw => sw.device_id));
  const available = registry.devices.filter(device => !added.has(device.id));
  if (available.length === 0) {
    const text = registry.devices.length === 0 ? "No switches found in Home Assistant." : "All switches have been added.";
    return el("div", { className: "muted", textContent: text, style: "margin-bottom:12px" });
  }
  const select = el("select", { ariaLabel: "Switch to add" }, ...available.map(device =>
    el("option", { value: device.id, textContent: device.model ? `${device.name} (${device.model})` : device.name })));
  return el("div", { className: "row", style: "margin-bottom:12px" }, el("div", { className: "grow" }, select),
    el("button", { textContent: "Add switch", onclick: () => { switches.push({ device_id: select.value }); render(); } }));
}

function render() {
  document.getElementById("content").replaceChildren(addRow(), ...switches.map(switchCard));
  document.getElementById("save").hidden = false;
}

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
  return body;
}

document.getElementById("save").onclick = async () => {
  try {
    await api("api/switches", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(switches) });
    setStatus("Saved.");
  } catch (error) { setStatus(`Could not save: ${error.message}`); }
};

(async () => {
  try {
    [registry, switches] = await Promise.all([api("api/registry"), api("api/switches")]);
    deviceById = new Map(registry.devices.map(device => [device.id, device]));
    render();
  } catch (error) { setStatus(`Could not load: ${error.message}`); }
})();
</script>
</body>
</html>
